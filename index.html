<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>foulplay ⚽</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#163C6E"/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --cream:#FFF8EE;--ink:#23201B;--soft:#6B6359;
  --blue:#163C6E;--blue2:#2A5DA0;
  --yellow:#FFD100;--terra:#E07A5F;--mint:#9DC8A0;
  --card:#FFFFFF;--line:#ECE2D2;
  --shadow:0 8px 24px rgba(60,40,20,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);
  overscroll-behavior:none;line-height:1.45}
.serif{font-family:'Fraunces',Georgia,serif}
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;padding-bottom:88px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:1rem}

.pad{padding:22px 20px}
.h1{font-family:'Fraunces',serif;font-size:2rem;line-height:1.08;font-weight:600;letter-spacing:-.5px}
.h2{font-family:'Fraunces',serif;font-size:1.35rem;font-weight:600}
.eyebrow{font-size:.72rem;letter-spacing:2px;text-transform:uppercase;color:var(--terra);font-weight:700}
.muted{color:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.btn{display:block;width:100%;text-align:center;background:var(--blue);color:#fff;font-weight:700;
  padding:16px;border-radius:16px;font-size:1.02rem;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--yellow);color:var(--ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.red{background:#CE1126}
.btn:disabled{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:14px;
  border:1.5px solid var(--line);background:#fff;font-weight:500;font-size:.9rem}
.row{display:flex;gap:10px}
.center{text-align:center}
.spacer{height:14px}
.divider{height:1px;background:var(--line);margin:18px 0}

/* screens / onboarding */
.screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 24px;
  animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.opt{width:100%;text-align:left;padding:18px;border-radius:18px;border:1.5px solid var(--line);
  background:#fff;margin-bottom:11px;font-weight:600;font-size:1.02rem;transition:transform .08s,border-color .15s}
.opt:active{transform:scale(.98)}
.opt .sub{font-weight:400;font-size:.85rem;color:var(--soft);margin-top:3px}
.opt.pick{border-color:var(--blue);background:#F3F7FD}
.progress{display:flex;gap:6px;margin-bottom:26px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.fill{background:var(--terra)}

/* session screen */
.code-box{font-family:'Fraunces',serif;font-size:2.4rem;letter-spacing:.25em;font-weight:600;
  background:#F3F7FD;border:2px solid var(--blue);border-radius:16px;padding:18px;text-align:center;
  margin:14px 0;user-select:all}
.join-input{width:100%;font-family:'Fraunces',serif;font-size:2rem;letter-spacing:.2em;text-align:center;
  border:2px solid var(--line);border-radius:16px;padding:16px;background:#fff;text-transform:uppercase}
.join-input:focus{border-color:var(--blue);outline:none}

/* disclaimer */
.disclaimer-scroll{max-height:52vh;overflow-y:auto;background:#f7f5f2;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:.66rem;line-height:1.65;color:#555;text-align:justify;-webkit-overflow-scrolling:touch}
.disclaimer-scroll b{color:#222}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sb-bump{background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;width:34px;height:34px;font-size:1.2rem;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .1s,background .1s}
.sb-bump:active{transform:scale(.88);background:rgba(255,255,255,.35)}

/* jersey picker */
.jersey-stage{display:flex;gap:40px;justify-content:center;align-items:flex-end;margin:28px 0 24px;overflow:visible}
.jersey-btn{background:none;border:none;padding:0 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;-webkit-tap-highlight-color:transparent;overflow:visible;transition:transform .15s}
.jersey-btn:active{transform:scale(.95)}
.j-wrap{position:relative;width:82px;height:122px;overflow:visible}
.j-body{width:82px;height:122px;border-radius:6px 6px 14px 14px;position:relative;transition:transform .1s;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.j-sleeve-l,.j-sleeve-r{position:absolute;top:2px;width:26px;height:36px;border-radius:5px 5px 0 0}
.j-sleeve-l{left:-20px;transform:rotate(-10deg);transform-origin:bottom right}
.j-sleeve-r{right:-20px;transform:rotate(10deg);transform-origin:bottom left}
.j-collar{position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:36px;height:18px;background:rgba(0,0,0,.12);border-radius:0 0 18px 18px}
.j-label{position:absolute;bottom:24px;left:0;right:0;text-align:center}
.j-name{font-size:.7rem;font-weight:900;letter-spacing:.15em;opacity:.85}
.j-num{font-size:2.4rem;font-weight:900;line-height:1;opacity:.9}
.jersey-tag{font-weight:700;font-size:.95rem;letter-spacing:.05em}

/* surprise message bubble */
.msg-bubble{background:#fff;border-radius:20px 20px 4px 20px;padding:18px 20px;box-shadow:0 4px 20px rgba(0,0,0,.1);font-size:.96rem;line-height:1.65;border:1.5px solid var(--line);max-width:340px;margin:0 auto}

/* scoreboard */
.scoreboard{background:linear-gradient(135deg,#163C6E 0%,#0E2746 100%);color:#fff;border-radius:24px;
  padding:20px;box-shadow:var(--shadow)}
.sb-status{font-size:.72rem;letter-spacing:1.5px;text-transform:uppercase;opacity:.8;text-align:center;margin-bottom:12px}
.sb-row{display:flex;align-items:center;justify-content:space-between}
.sb-team{flex:1;text-align:center}
.sb-flag{font-size:2.1rem}
.sb-name{font-weight:700;margin-top:3px;font-size:.9rem}
.sb-score{font-family:'Fraunces',serif;font-size:2.8rem;font-weight:600;min-width:44px;text-align:center}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#FF5252;
  margin-right:5px;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.feed-item{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.feed-item .min{font-weight:700;color:var(--terra);min-width:36px}
.feed-item:last-child{border-bottom:none}

/* mascot */
#mascot-outer{position:fixed;left:8px;bottom:76px;z-index:60;display:flex;flex-direction:column;
  align-items:center;animation:bob 2.4s ease-in-out infinite;pointer-events:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.m-mid{display:flex;align-items:center} /* arms + ball row */
.m-arm{width:22px;height:7px;background:#fff;border:2.5px solid #111;border-radius:10px;
  flex-shrink:0;pointer-events:none}
.m-arm-l{transform:rotate(32deg) translateY(6px);transform-origin:right center}
.m-arm-r{transform:rotate(-32deg) translateY(6px);transform-origin:left center}
.m-legs{display:flex;gap:16px;margin-top:2px;padding:0 8px}
.m-leg{display:flex;flex-direction:column;align-items:center;gap:0}
.m-shin{width:7px;height:16px;background:#fff;border:2px solid #111;border-radius:4px}
.m-shoe{width:14px;height:7px;background:#CE1126;border:2px solid #111;border-radius:0 6px 6px 0;margin-top:-1px}
.m-shoe-l{border-radius:6px 0 0 6px}
#mascot{width:90px;height:90px;border-radius:50%;cursor:pointer;pointer-events:auto;
  display:flex;align-items:center;justify-content:center;position:relative;
  background:
    radial-gradient(circle 9px at 19% 13%,#111 98%,transparent 100%),
    radial-gradient(circle 9px at 81% 13%,#111 98%,transparent 100%),
    radial-gradient(circle 8px at 4%  54%,#111 98%,transparent 100%),
    radial-gradient(circle 8px at 96% 54%,#111 98%,transparent 100%),
    radial-gradient(circle 9px at 50% 93%,#111 98%,transparent 100%),
    #fff;
  border:3px solid #111;box-shadow:0 8px 24px rgba(0,0,0,.28)}
#mascot:active{transform:scale(.9)}
#mascot.hype{animation:spin .5s ease-in-out}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
#mface{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;pointer-events:none}
.mbrows{display:flex;gap:14px;margin-bottom:-1px}
.mbrow{width:13px;height:3px;background:#111;border-radius:3px;transition:transform .25s}
.meyes{display:flex;gap:12px;position:relative;z-index:2}
.meye{width:14px;height:14px;border-radius:50%;background:#111;position:relative;animation:blink 4s ease-in-out infinite}
.meye::after{content:'';position:absolute;width:4px;height:4px;background:#fff;border-radius:50%;top:2px;right:2px}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(0.05)}}
.mmouth{width:26px;height:13px;border:3px solid #111;border-top:none;border-radius:0 0 26px 26px;transition:all .25s}
.mmouth.sad{border-top:3px solid #111;border-bottom:none;border-radius:26px 26px 0 0;margin-top:5px}
.mmouth.shocked{width:14px;height:14px;border:3px solid #111;border-radius:50%}
#bubble{position:fixed;left:24px;bottom:194px;z-index:61;max-width:260px;background:#fff;
  border:2px solid var(--blue);border-radius:18px 18px 18px 4px;padding:14px 16px;
  box-shadow:var(--shadow);display:none}
#bubble.show{display:block;animation:pop .25s ease}
#bubble .who{font-size:.68rem;letter-spacing:1px;text-transform:uppercase;color:var(--terra);
  font-weight:700;margin-bottom:4px}
#bubble p{font-family:'Fraunces',serif;font-size:.98rem;font-style:italic;line-height:1.4}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(6px)}to{opacity:1;transform:none}}

/* nav */
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  background:rgba(255,248,238,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:none;flex;z-index:50;padding:8px 2px calc(8px + env(safe-area-inset-bottom))}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
  font-size:.72rem;font-weight:600;color:var(--soft)}
#nav button .ic{font-size:1.3rem;opacity:.7;transition:transform .15s}
#nav button.on{color:var(--blue)}
#nav button.on .ic{opacity:1;transform:translateY(-2px)}

/* tabs */
.tab{display:none}
.tab.on{display:block;animation:fade .3s ease}
.sectitle{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.sectitle .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--terra)}

/* counters */
.counter{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;
  border:1.5px solid var(--line);border-radius:15px;background:#fff;margin-bottom:9px}
.counter .lbl{font-weight:600;font-size:.9rem;flex:1;padding-right:10px}
.counter .ct{display:flex;align-items:center;gap:12px}
.counter .num{font-family:'Fraunces',serif;font-weight:600;font-size:1.3rem;min-width:22px;text-align:center}
.plus{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;font-size:1.4rem;
  display:flex;align-items:center;justify-content:center}
.minus{width:30px;height:30px;border-radius:50%;background:var(--line);color:var(--soft);font-size:1.1rem;
  display:flex;align-items:center;justify-content:center}

/* inputs */
textarea.note{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px;
  resize:none;min-height:64px;background:#fff}
textarea.note:focus{border-color:var(--blue);outline:none}
input.txt{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px;background:#fff}
input.txt:focus{border-color:var(--blue);outline:none}
.logline{padding:11px 13px;background:#FBF6EC;border-radius:12px;margin-bottom:8px;font-size:.9rem;line-height:1.4}
.logline .meta{font-size:.7rem;color:var(--soft);font-weight:700;margin-bottom:3px}

/* bets */
.bet{border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:#fff}
.bet .q{font-weight:600;margin-bottom:10px;font-size:.95rem}
.pickrow{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.pickrow .who{font-size:.7rem;font-weight:700;width:44px;color:var(--soft);flex-shrink:0}
.pickrow button{flex:1;padding:9px 6px;border-radius:11px;border:1.5px solid var(--line);
  font-weight:600;font-size:.82rem;transition:background .12s}
.pickrow button.sel-her{background:#E07A5F;color:#fff;border-color:#E07A5F}
.pickrow button.sel-him{background:var(--blue);color:#fff;border-color:var(--blue)}
.pickrow button.sel-res{background:var(--mint);color:var(--ink);border-color:var(--mint)}

/* photos */
.photo-cell{border:1.5px dashed var(--line);border-radius:16px;padding:14px;margin-bottom:10px;background:#fff}
.photo-cell.done{border-style:solid;border-color:var(--mint)}
.photo-cell img{width:100%;border-radius:11px;margin-top:10px;display:block;max-height:260px;object-fit:cover}
.photo-cell .cap{font-weight:600;font-size:.95rem}
.photo-cell .hint{font-size:.8rem;color:var(--soft);margin-top:3px}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;margin-bottom:16px}
.tl .ev:before{content:"";position:absolute;left:-23px;top:5px;width:11px;height:11px;border-radius:50%;
  background:var(--terra);border:2px solid var(--cream)}
.tl .ev .t{font-weight:700;font-size:.82rem;color:var(--blue)}

/* sync indicator */
.sync-bar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  background:var(--mint);color:var(--ink);font-size:.78rem;font-weight:700;text-align:center;
  padding:6px;z-index:80;display:none}
.sync-bar.show{display:block}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden;display:none}
.confetti.go{display:block}
.cf{position:absolute;width:9px;height:14px;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.tag{display:inline-block;font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:20px;
  background:#F3F7FD;color:var(--blue)}
.flagband{height:5px;border-radius:4px;display:flex;overflow:hidden;margin:8px 0}
.flagband i{flex:1}
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.stat-row:last-child{border-bottom:none}
.recap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}

/* milestones */
.milestone-row{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.milestone-row::-webkit-scrollbar{display:none}
.ms-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 12px;
  border-radius:16px;border:1.5px solid var(--line);background:#fff;cursor:pointer;min-width:70px;
  transition:background .12s,border-color .15s}
.ms-btn.done{background:#E8F5E9;border-color:var(--mint)}
.ms-btn .ms-icon{font-size:1.5rem}
.ms-btn .ms-lbl{font-size:.62rem;font-weight:700;color:var(--soft);text-align:center;line-height:1.2}
.ms-btn.done .ms-lbl{color:#388e3c}
.ms-time{font-size:.56rem;color:#388e3c;font-weight:700}

/* floating quote */
#quickQuote{position:fixed;right:20px;bottom:106px;z-index:62;width:44px;height:44px;border-radius:50%;
  background:var(--terra);color:#fff;font-size:1.1rem;box-shadow:0 4px 14px rgba(0,0,0,.22);
  display:none;align-items:center;justify-content:center;border:3px solid #fff}
#quickQuote.show{display:flex;animation:pop .2s ease}
/* floating photo */
#quickPhoto{position:fixed;right:20px;bottom:158px;z-index:62;width:44px;height:44px;border-radius:50%;
  background:var(--blue);color:#fff;font-size:1.1rem;box-shadow:0 4px 14px rgba(0,0,0,.22);
  display:none;align-items:center;justify-content:center;border:3px solid #fff}
#quickPhoto.show{display:flex;animation:pop .2s ease}

/* quick modals */
#quickModal,#photoModal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5);display:none;align-items:flex-end}
#quickModal.show,#photoModal.show{display:flex;animation:fade .2s ease}
.qm-sheet{background:#fff;width:100%;max-width:520px;margin:0 auto;
  border-radius:24px 24px 0 0;padding:24px 20px calc(40px + env(safe-area-inset-bottom))}

/* kiss cam overlay */
#kissCam{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.88);display:none;
  flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:30px}
#kissCam.show{display:flex;animation:fade .3s ease}
.kc-heart{font-size:4rem;animation:bob .8s ease-in-out infinite}

/* say this card */
#sayThisCard{position:fixed;bottom:96px;left:0;right:0;max-width:520px;margin:0 auto;
  z-index:85;padding:0 14px;display:none}
#sayThisCard.show{display:block;animation:slideup .35s ease}
@keyframes slideup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ---- mascot extra animations ---- */
@keyframes sway{0%,100%{transform:rotate(0)}30%{transform:rotate(-11deg)}70%{transform:rotate(11deg)}}
@keyframes jumpup{0%,100%{transform:translateY(0)}35%{transform:translateY(-22px)}65%{transform:translateY(-9px)}}
@keyframes shimmy{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-5px) rotate(-5deg)}40%{transform:translateX(5px) rotate(5deg)}60%{transform:translateX(-4px) rotate(-4deg)}80%{transform:translateX(4px) rotate(4deg)}}
@keyframes shiver{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
@keyframes armwv{0%{transform:rotate(32deg) translateY(6px)}33%{transform:rotate(-55deg) translateY(-16px)}66%{transform:rotate(80deg) translateY(12px)}100%{transform:rotate(32deg) translateY(6px)}}
@keyframes legkick{0%,100%{transform:rotate(0);transform-origin:top center}50%{transform:rotate(45deg);transform-origin:top center}}
@keyframes lookleft{0%,100%{transform:translateX(0)}50%{transform:translateX(-5px)}}
@keyframes lookright{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}

#mascot-outer.swaying{animation:sway .6s ease-in-out 2!important}
#mascot-outer.jumping{animation:jumpup .45s ease-in-out 2!important}
#mascot-outer.shimmying{animation:shimmy .38s ease-in-out 3!important}
#mascot-outer.shivering{animation:shiver .22s ease-in-out 4!important}
.arm-wave{animation:armwv .38s ease-in-out 3!important;transform-origin:right center!important}
.leg-kick{animation:legkick .32s ease-in-out 2!important;transform-origin:top center!important}
#mface.looking-l{animation:lookleft .7s ease-in-out 1}
#mface.looking-r{animation:lookright .7s ease-in-out 1}
</style>
</head>
<body>
<div id="syncBar" class="sync-bar">syncing...</div>
<div id="confetti" class="confetti"></div>
<div id="bubble" onclick="this.classList.remove('show')">
  <div class="who">Coach Ball says</div><p id="bubbleText"></p>
</div>
<div id="mascot-outer">
  <div class="m-mid">
    <div class="m-arm m-arm-l"></div>
    <div id="mascot" onclick="tapMascot()">
      <div id="mface">
        <div class="mbrows"><div class="mbrow" id="browL"></div><div class="mbrow" id="browR"></div></div>
        <div class="meyes"><div class="meye" id="eyeL"></div><div class="meye" id="eyeR"></div></div>
        <div class="mmouth" id="mmouth"></div>
      </div>
    </div>
    <div class="m-arm m-arm-r"></div>
  </div>
  <div class="m-legs">
    <div class="m-leg"><div class="m-shin"></div><div class="m-shoe m-shoe-l"></div></div>
    <div class="m-leg"><div class="m-shin"></div><div class="m-shoe"></div></div>
  </div>
</div>
<button id="quickPhoto" onclick="openQuickPhoto()">📷</button>
<button id="quickQuote" onclick="openQuickQuote()">💬</button>
<div id="photoModal" onclick="closeQuickPhoto()">
  <div class="qm-sheet" onclick="event.stopPropagation()" style="max-height:70vh;overflow-y:auto">

      const withPhotos={...base,photos:S.photos};
      const body=JSON.stringify(withPhotos).length<87000?JSON.stringify(withPhotos):JSON.stringify(base);
      await fetch(`${BIN_BASE}/${S.binId}`,{
        method:"PUT",headers:{"Content-Type":"application/json","X-Master-Key":BIN_KEY},
        body
      });
      hideSyncBar();
    }catch(e){hideSyncBar();}
  },600);
}

let pollInterval=null;
async function pollSync(){
  if(!S.binId||S.soloMode)return;
  try{
    const r=await fetch(`${BIN_BASE}/${S.binId}/latest`,{headers:{"X-Master-Key":BIN_KEY}});
    const j=await r.json();
    const payload=j.record;
    if(payload&&payload.ts>S.remoteTs){
      const prevScore=JSON.stringify(S.score);
      const prevEvents=S.events.length;
      applySyncPayload(payload);
      // check for new goal events
      if(S.events.length>prevEvents){
        const newest=S.events[S.events.length-1];
        if(newest&&newest.icon==="⚽"){
          const colScored2=newest.title.toLowerCase().includes("colombia");
          const ours=isOurGoal(newest.title);
          if(ours){confetti();playGoalHorn();}else{playTone(330,.4,"sine",.18);}
          flashMascot(rand(ours?(colScored2?REACT.colGoal:REACT.jorGoal):REACT.theirGoal),ours?"goal":null);
          sendNotif(ours?"⚽ GOAL! 🎉":"⚽ They scored",newest.title);
          setTimeout(()=>showSayThis(ours?SAY_THIS.ourGoal:SAY_THIS.theirGoal),2000);
        }
      }
      if(JSON.stringify(S.score)!==prevScore&&document.getElementById("tab-match")){
        paintScoreboard();
      }
      softRender();
    }
  }catch(e){}
}

function startPolling(){
  clearInterval(pollInterval);
  pollInterval=setInterval(()=>{
    if(["FT","AET","PEN"].includes(S.lastStatus))return;
    pollSync();
  },5000);
  requestNotifPerm();
}

}

async function doCreate(){
  document.getElementById("createBtn").textContent="creating...";
  document.getElementById("createBtn").disabled=true;
  try{
    const id=await createBin();
    if(!id){alert("Couldn't create session — check wifi and try again.");return;}
    S.binId=id;S.role="host";
    saveLocal();startPolling();
    render();go("plan");
    flashMascot("Session created! Copy the link in the Plan tab and send it to Rahman. 🔗");
  }catch(e){const b=document.getElementById("createBtn");if(b){b.disabled=false;b.textContent="↻ retry";}flashMascot("Can't connect — tap solo mode below if it keeps failing. ⚠️");}
}

async function doJoin(){
  const code=document.getElementById("joinCode").value.trim();
  if(!code){alert("Paste the session code from the other phone.");return;}
  document.getElementById("joinBtn").textContent="joining...";
  document.getElementById("joinBtn").disabled=true;
  try{
    const ok=await joinBin(code);
    if(!ok){const b=document.getElementById("joinBtn");if(b){b.disabled=false;b.textContent="join →";}flashMascot("Can't find that session — check the code, or tap solo mode below. ⚠️");return;}
    S.binId=code;S.role="guest";S.onboarded=true;
    saveLocal();startPolling();
    findFixture().then(()=>pollNow());
    render(); // will hit rahmanWelcome screen
  }catch(e){const b=document.getElementById("joinBtn");if(b){b.disabled=false;b.textContent="join →";}flashMascot("Network error — try again or tap solo mode below. ⚠️");}
}

function activateSoloMode(){
  S.soloMode=true;

function setBet(who,i,o){
  if(who==="her")S.betHer[i]=o; else if(who==="him")S.betHim[i]=o; else S.betResult[i]=o;
  syncSave();tallyBets();
  // re-render the bet card in place
  const old=document.querySelectorAll(".bet")[i];
  if(old){old.outerHTML=betCard(BETS[i],i);}
  tallyBets();
}
function tallyBets(){
  let h=0,m=0;
  BETS.forEach((b,i)=>{
    if(S.betResult[i]){if(S.betHer[i]===S.betResult[i])h++;if(S.betHim[i]===S.betResult[i])m++;}
  });
  const eh=document.getElementById("scoreHer"),em=document.getElementById("scoreHim");
  if(eh)eh.textContent=h;if(em)em.textContent=m;
}

function wagerCardContent(who){
  const isHer=who==="her";
  const isMyCard=(isHer&&S.jerseyRole==="rahman")||(!isHer&&S.jerseyRole==="pathak");
  const wager=isHer?S.wagerHer:S.wagerHim;
  const otherWager=isHer?S.wagerHim:S.wagerHer;
  const inputId=isHer?"wagerHerIn":"wagerHimIn";
  const ph=isHer?"e.g. 'if i win, you have to learn the colombia chant'":"e.g. 'if i win, you have to watch a full match with me every weekend'";
  const otherName=isHer?"Pathak":"Rahman";
  // not your wager — only show sealed status, never the content
  if(!isMyCard&&!S.wagerRevealed)return `<div style="font-weight:700;margin-bottom:4px">🔒 ${otherName}'s secret wager</div>
    <p class="muted" style="font-size:.8rem">${wager?"sealed and waiting for the recap reveal.":"nothing wagered yet."}</p>`;
  return `<div style="font-weight:700;margin-bottom:4px">🔒 your secret wager</div>
    <p class="muted" style="font-size:.8rem;margin-bottom:10px">Only you can see this until the recap reveal. A dare, a favor, a dinner — whatever you want to put up. Locked until the final whistle.</p>
    ${S.wagerRevealed
      ?`<div class="logline">${esc(wager||"(nothing wagered)")}</div>`
      :`<textarea class="note" id="${inputId}" placeholder="${ph}" style="min-height:80px">${esc(wager||"")}</textarea>
        <div class="spacer"></div>
        <button class="btn ghost" onclick="saveWager('${who}')">seal my wager 🔒</button>
        ${wager?`<p class="muted" style="font-size:.76rem;margin-top:6px">✅ sealed — editable until the recap</p>`:""}`
    }
    ${otherWager&&!S.wagerRevealed?`<div class="divider"></div><p class="muted" style="font-size:.8rem">${otherName}'s wager: <b>🔒 sealed</b> — revealed at the end</p>`:""}`;
}

function saveWager(who){
  const inputId=who==="her"?"wagerHerIn":"wagerHimIn";
  const el=document.getElementById(inputId);
  if(!el)return;
  const v=el.value.trim();
  if(who==="her")S.wagerHer=v; else S.wagerHim=v;
  syncSave();
  flashMascot("Sealed. Cannot wait to see how this plays out. 🔒");
  // in-place update — no full re-render needed
  const cardId=who==="her"?"wagerHerCard":"wagerHimCard";
  const card=document.getElementById(cardId);
  if(card)card.innerHTML=wagerCardContent(who);
  // also update the other wager card's sealed status indicator
  const otherId=who==="her"?"wagerHimCard":"wagerHerCard";
  const other=document.getElementById(otherId);
  if(other)other.innerHTML=wagerCardContent(who==="her"?"him":"her");
}

/* ===================== AUDIO + HAPTICS ===================== */
let _audioCtx=null;
function getAudio(){
  if(!_audioCtx)_audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(_audioCtx.state==="suspended")_audioCtx.resume();
  return _audioCtx;
}
function playTone(freq,dur,type,vol){
  try{
    const ctx=getAudio(),o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type||"sine";o.frequency.setValueAtTime(freq,ctx.currentTime);
    g.gain.setValueAtTime(vol||.3,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);
    o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur);
  }catch(e){}
}
function playGoalHorn(){
  playTone(220,.18,"sawtooth",.4);
  setTimeout(()=>playTone(330,.18,"sawtooth",.4),200);
  setTimeout(()=>playTone(440,.55,"sawtooth",.4),400);
}
function playWhistle(){
  try{
    const ctx=getAudio(),o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(800,ctx.currentTime);
    o.frequency.linearRampToValueAtTime(1200,ctx.currentTime+.15);
    g.gain.setValueAtTime(.38,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);
    o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.35);
  }catch(e){}
}
function playCardSound(){
  playTone(440,.07,"square",.22);
  setTimeout(()=>playTone(330,.18,"square",.18),90);
}
// unlock AudioContext on first tap (iOS requirement)
document.addEventListener("touchstart",()=>{try{getAudio();}catch(e){}},{once:true,passive:true});

function bumpScore(side,dec=false){
  const d=dec?-1:1;
  if(side==="col") S.score.h=Math.max(0,(S.score.h||0)+d);
  else S.score.a=Math.max(0,(S.score.a||0)+d);

  flashMascot(rand(ours?(side==="col"?REACT.colGoal:REACT.jorGoal):REACT.theirGoal),ours?"goal":null);

}
async function findFixture(){
  try{
    const r=await fetch("https://v3.football.api-sports.io/fixtures?date=2026-06-07&timezone=America/Los_Angeles",
      {headers:{"x-apisports-key":FOOTBALL_KEY}});
    const j=await r.json();
    const m=(j.response||[]).find(f=>{
      const h=(f.teams.home.name||"").toLowerCase(),a=(f.teams.away.name||"").toLowerCase();
      return (h.includes("colombia")||a.includes("colombia"))&&(h.includes("jordan")||a.includes("jordan"));
    });
    if(m){S.fixtureId=m.fixture.id;S.homeIsCol=(m.teams.home.name||"").toLowerCase().includes("colombia");saveLocal();}
  }catch(e){console.warn(e);}
}
async function pollNow(){
  if(!S.fixtureId){paintScoreboard();return;}
  try{
    const r=await fetch("https://v3.football.api-sports.io/fixtures?id="+S.fixtureId,
      {headers:{"x-apisports-key":FOOTBALL_KEY}});
    const j=await r.json();const f=(j.response||[])[0];if(!f)return;
    const colHome=S.homeIsCol!==false;
    const gh=f.goals.home||0,ga=f.goals.away||0;
    S.score={h:colHome?gh:ga,a:colHome?ga:gh};
    const st=f.fixture.status.short;
    S.statusText=statusLabel(st,f.fixture.status.elapsed);
    if(st!==S.lastStatus){
      if(st==="1H"&&S.lastStatus==="NS"){
        playWhistle();
        flashMascot(rand(REACT.kickoff),"celebrate");
        sendNotif("⚽ KICKOFF!","Colombia vs Jordan is live. Let's go.");
        setTimeout(()=>showSayThis(SAY_THIS.kickoff),2000);
      }
      if(st==="HT"){
        flashMascot(rand(REACT.half),"celebrate");
        sendNotif("🟡 HALFTIME","Take a breather — see you in the second half.");
        setTimeout(()=>showSayThis(SAY_THIS.half),2500);
      }
      if(st==="FT"||st==="AET"||st==="PEN")flashMascot(rand(REACT.full),"celebrate");
      S.lastStatus=st;
    }
    const evs=f.events||[];
    S.events=evs.map(e=>({
      min:e.time.elapsed+(e.time.extra?"+"+e.time.extra:""),
      icon:e.type==="Goal"?"⚽":(e.type==="Card"?(e.detail&&e.detail.includes("Red")?"🟥":"🟨"):(e.type==="subst"?"🔁":"•")),
      title:(e.type==="Goal"?"GOAL — ":"")+(e.team?.name||"")+(e.type==="Card"?" "+(e.detail||""):"")+(e.type==="subst"?" sub":""),
      detail:e.player?.name||(e.assist?.name?`assist: ${e.assist.name}`:""),
      key:`${e.time.elapsed}-${e.player?.id}-${e.type}`
    }));
    S.events.forEach(e=>{
      if(!S.seenEvents.includes(e.key)){
        S.seenEvents.push(e.key);
        if(e.icon==="⚽"){
          const colG=e.title.toLowerCase().includes("colombia");
          const ours=isOurGoal(e.title);
          if(ours){confetti();playGoalHorn();}else{playTone(330,.4,"sine",.18);}
          flashMascot(rand(ours?(colG?REACT.colGoal:REACT.jorGoal):REACT.theirGoal),ours?"goal":null);
          sendNotif(ours?"⚽ GOAL! 🎉":"⚽ They scored",e.title);
          setTimeout(()=>showSayThis(ours?SAY_THIS.ourGoal:SAY_THIS.theirGoal),2000);
        } else if(e.icon==="🟨"||e.icon==="🟥"){
          flashMascot(rand(REACT.card));
          playCardSound();
          setTimeout(()=>showSayThis(SAY_THIS.card),1500);
        }
      }
    });
    syncSave();paintScoreboard();
  }catch(e){console.warn("poll failed",e);}
}
function statusLabel(st,el){
  return {NS:"Kickoff 4:00 PM PDT",HT:"Halftime — 15 min break",FT:"Full Time",PST:"Postponed",
    "1H":"1st Half "+(el||"")+"'","2H":"2nd Half "+(el||"")+"'",ET:"Extra Time",PEN:"Penalties",AET:"After Extra Time"}[st]||st;
}

/* ===================== PHOTOS ===================== */
function resizeImg(img,maxPx,quality){
  const scale=Math.min(1,maxPx/Math.max(img.width,img.height));
  const c=document.createElement("canvas");
  c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",quality);
}

function snap(id,input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      try{
        // HQ version lives in localStorage only (not synced)
        localStorage.setItem("hq_"+id, resizeImg(img,600,0.6));
        // Small version goes into S.photos for sync
        S.photos[id]=resizeImg(img,180,0.18);
        saveLocal();
        render();go("play");
        flashMascot("Now THAT is a keeper shot. 📸");
        updatePhotoCount();
      }catch(er){
        // If localStorage is full, save only the small version
        try{S.photos[id]=resizeImg(img,180,0.18);saveLocal();render();go("play");}catch(e2){alert("Storage full — try deleting a photo first.");}
      }
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      try{localStorage.setItem("hq_kisscam",resizeImg(img,600,0.6));}catch(e){}
      S.photos["kisscam"]=resizeImg(img,180,0.18);saveLocal();
      closeKissCam();flashMascot("LEGENDARY. That one's going on the wall. 💋📸");
      syncSave();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}
// random kiss cam during game — fires once between 30-75 min mark if both in stadium
setInterval(()=>{
  if(!kissCamArmed&&S.milestones.in&&S.lastStatus&&["1H","2H"].includes(S.lastStatus)){
    if(Math.random()<0.003)triggerKissCam(); // ~1 check per 90s, very low probability
  }
},90000);
function resetSession(){
  const v=prompt('Type RESET to confirm (this clears all bets, notes, photos, and logs):');
  if(v!=="RESET")return;
  localStorage.clear();location.reload();
}

/* ===================== BOOT ===================== */
scheduleIdleAnim();
loadLocal();

const _urlJoin=new URLSearchParams(location.search).get('join');
if(_urlJoin&&!S.binId){
  // Rahman tapped Pathak's link — auto-join
  S.jerseyRole='rahman';S.role='guest';saveLocal();
  $app().innerHTML=`<div class="screen center">
    <div style="font-size:2rem;animation:bob 1s ease-in-out infinite">⚽</div>
    <h2 class="h2" style="margin:16px 0 8px">loading...</h2>
    <p class="muted">joining today's game</p>
  </div>`;
  joinBin(_urlJoin).then(ok=>{
    if(ok){S.binId=_urlJoin;S.onboarded=true;saveLocal();startPolling();findFixture().then(()=>pollNow());}
    render();
  }).catch(()=>render());
}else{
  render();
  if(S.onboarded){
    go(S.tab||"match");
    setTimeout(tallyBets,100);
    findFixture().then(()=>pollNow());
    if(S.binId)startPolling();
  }
}
</script>
